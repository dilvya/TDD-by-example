name: tests

on: 
  pull_request:
    branches: 
      - dev 
      - main
  push:
    branches:
      - dev
      - main
permissions:
  contents: read
  checks: write 
  pull-requests: write 

jobs: 
  unit-tests:
    runs-on: self-hosted
    steps: 
      - name: Download changes
        uses: actions/checkout@v4
      
      - name: Check cmake version
        run: cmake --version 

      - name: Configure project
        run: cmake -S . -B build
      
      - name:  Build project
        run: cmake --build build

      - name:  Run tests
        run:  ctest --test-dir build --output-junit report.xml

      - name: Compute code coverage percentage
        run: gcovr -r . --print-summary --exclude build/_deps/googletest-src --fail-under-line 100

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/report.xml'

